name: opentofu-check-plan

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/opentofu-check-plan.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/opentofu-check-plan.yml

jobs:
  fmt-validate-plan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || secrets.TF_STATE_KEY }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || secrets.TF_LOCK_TABLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8

      - name: Validate backend env values
        run: |
          test -n "$AWS_REGION" || (echo "AWS_REGION is empty" && exit 1)
          test -n "$TF_STATE_BUCKET" || (echo "TF_STATE_BUCKET is empty" && exit 1)
          test -n "$TF_STATE_KEY" || (echo "TF_STATE_KEY is empty" && exit 1)
          test -n "$TF_LOCK_TABLE" || (echo "TF_LOCK_TABLE is empty" && exit 1)

      - name: Show tofu version
        run: tofu version

      - name: Tofu fmt check
        run: tofu fmt -check -recursive

      - name: Tofu init backend
        run: |
          tofu init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Tofu validate
        run: tofu validate

      - name: Tofu plan
        run: |
          tofu plan -out phase1-infra.tfplan
          tofu show -no-color phase1-infra.tfplan > plan.txt

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan-${{ github.run_id }}
          path: |
            infra/phase1-infra.tfplan
            infra/plan.txt
