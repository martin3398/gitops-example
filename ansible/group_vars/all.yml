---
ansible_connection: amazon.aws.aws_ssm

# Can be overridden via environment variables when needed.
aws_region: eu-central-1
aws_profile: ""

ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') | default(aws_region, true) }}"
ansible_aws_ssm_bucket_name: "{{ lookup('env', 'ANSIBLE_SSM_BUCKET') | default('', true) }}"

# Session Manager prefers explicit shell for remote command execution.
ansible_shell_type: sh
ansible_shell_executable: /bin/sh
