---
ansible_connection: amazon.aws.aws_ssm

# Can be overridden via environment variables when needed.
aws_region: eu-central-1
aws_profile: ""

ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') | default(aws_region, true) }}"
ansible_aws_ssm_bucket_name: "{{ lookup('env', 'ANSIBLE_SSM_BUCKET') | default('', true) }}"

runtime_containerd_config_path: /etc/containerd/config.toml
runtime_kubernetes_version: "1.30"

cluster_validate_retries: 60
cluster_validate_delay: 10
cluster_validate_expected_nodes: 6

# Shared cluster access path after RKE2 bootstrap.
cluster_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
rke2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
rke2_kubectl_path: /var/lib/rancher/rke2/bin/kubectl

# Shared RKE2 paths.
rke2_config_dir: /etc/rancher/rke2
rke2_manifests_dir: /var/lib/rancher/rke2/server/manifests
rke2_server_token_path: /var/lib/rancher/rke2/server/node-token
rke2_server_config_path: /etc/rancher/rke2/config.yaml
rke2_cilium_manifest_path: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
rke2_cilium_gateway_bootstrap_rbac_path: /var/lib/rancher/rke2/server/manifests/cilium-gateway-bootstrap-rbac.yaml
rke2_gateway_api_standard_manifest_path: /var/lib/rancher/rke2/server/manifests/gateway-api-standard.yaml
rke2_gateway_api_experimental_manifest_path: /var/lib/rancher/rke2/server/manifests/gateway-api-experimental.yaml
rke2_gateway_api_standard_manifest_url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.1/standard-install.yaml
rke2_gateway_api_standard_manifest_checksum: sha256:73b91b77f6be023a8c92c969fc664e5bd3b1a28aea59eac9ebc904607354dad2
rke2_gateway_listener_port: 8080
rke2_gateway_worker_label: "node-role.kubernetes.io/worker=true"
rke2_join_config_path: /etc/rancher/rke2/config.yaml
rke2_join_server_url: "https://{{ hostvars[groups['control_plane'][0]].private_ip }}:9345"
rke2_api_server_sans:
  - "{{ kube_api_internal_endpoint | split(':') | first }}"
  - "{{ kube_api_public_endpoint | split(':') | first }}"
rke2_cluster_cidr: 192.168.0.0/16
rke2_service_cidr: 10.96.0.0/12
rke2_ingress_controller: none
rke2_version: "v1.30.13+rke2r1"
rke2_install_script_url: https://get.rke2.io

# Session Manager prefers explicit shell for remote command execution.
ansible_shell_type: sh
ansible_shell_executable: /bin/sh
