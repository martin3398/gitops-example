---
- name: Ensure kubelet working directory exists
  ansible.builtin.file:
    path: /var/lib/kubelet
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf_stat

- name: Initialize first control plane
  ansible.builtin.command: >-
    kubeadm init
    --kubernetes-version {{ kubeadm_kubernetes_version }}
    --control-plane-endpoint {{ kubeadm_control_plane_endpoint }}
    {% for san in (kubeadm_apiserver_cert_extra_sans | default([]) | map('regex_replace', ':\\d+$', '') | map('trim') | reject('equalto', '') | unique) %}
    --apiserver-cert-extra-sans {{ san }}
    {% endfor %}
    --pod-network-cidr {{ kubeadm_pod_subnet }}
    --service-cidr {{ kubeadm_service_subnet }}
    --cri-socket {{ kubeadm_cri_socket }}
    {% if kubeadm_upload_certs %}--upload-certs{% endif %}
  register: kubeadm_init_result
  changed_when: "'Your Kubernetes control-plane has initialized successfully' in (kubeadm_init_result.stdout | default(''))"
  when: not kubeadm_admin_conf_stat.stat.exists

- name: Ensure root kubeconfig directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy admin kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: "0600"
    remote_src: true

- name: Wait for Kubernetes API ready endpoint
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
  register: kubeadm_apiserver_readyz
  changed_when: false
  retries: 30
  delay: 10
  until: "'ok' in (kubeadm_apiserver_readyz.stdout | default(''))"

- name: Patch kube-proxy metrics bind address
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system get configmap kube-proxy -o yaml \
      | python3 -c 'import sys; data = sys.stdin.read(); sys.stdout.write(data.replace("metricsBindAddress: \"\"", "metricsBindAddress: 0.0.0.0:10249", 1))' \
      | kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart kube-proxy daemonset
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system
    rollout restart daemonset/kube-proxy
  changed_when: false

- name: Wait for kube-proxy daemonset rollout
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf -n kube-system
    rollout status daemonset/kube-proxy --timeout=5m
  changed_when: false

- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_worker_join_command
  changed_when: false

- name: Generate control-plane certificate key
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_upload_certs_result
  changed_when: false

- name: Extract control-plane certificate key
  ansible.builtin.set_fact:
    kubeadm_certificate_key: "{{ (kubeadm_upload_certs_result.stdout_lines | reject('equalto', '') | list)[-1] | trim }}"

- name: Set shared join facts for all hosts
  ansible.builtin.set_fact:
    cluster_worker_join_command: "{{ kubeadm_worker_join_command.stdout | trim }}"
    cluster_control_plane_join_command: "{{ (kubeadm_worker_join_command.stdout | trim) ~ ' --control-plane --certificate-key ' ~ kubeadm_certificate_key }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['k8s_cluster'] }}"
