---
- name: Check containerd version
  ansible.builtin.command: containerd --version
  register: runtime_containerd_version
  changed_when: false

- name: Check RKE2 version pin format
  ansible.builtin.assert:
    that:
      - rke2_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+\+rke2r[0-9]+$')
    fail_msg: "RKE2 version pin is not in the expected format."

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Assert runtime services are active
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get("containerd.service", {}).get("state") == "running"
      - ansible_facts.services.get("containerd.service", {}).get("status") == "enabled"
      - ansible_facts.services.get(rke2_service_name ~ ".service", {}).get("status") == "enabled"
    fail_msg: "containerd must be running/enabled and {{ rke2_service_name }} must be enabled on {{ inventory_hostname }}"
