---
- name: Check containerd version
  ansible.builtin.command: containerd --version
  register: runtime_containerd_version
  changed_when: false

- name: Check kubelet version
  ansible.builtin.command: kubelet --version
  register: runtime_kubelet_version
  changed_when: false

- name: Check kubeadm version
  ansible.builtin.command: kubeadm version -o short
  register: runtime_kubeadm_version
  changed_when: false

- name: Check kubectl client version
  ansible.builtin.command: kubectl version --client=true --output=yaml
  register: runtime_kubectl_version
  changed_when: false

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Assert runtime services are active
  ansible.builtin.assert:
    that:
      - ansible_facts.services.get("containerd.service", {}).get("state") == "running"
      - ansible_facts.services.get("containerd.service", {}).get("status") == "enabled"
      - ansible_facts.services.get("kubelet.service", {}).get("status") == "enabled"
    fail_msg: "containerd must be running/enabled and kubelet must be enabled on {{ inventory_hostname }}"
