---
rke2_kubeconfig_path: /etc/rancher/rke2/rke2.yaml
rke2_kubectl_path: /var/lib/rancher/rke2/bin/kubectl
openbao_kubeconfig: "{{ rke2_kubeconfig_path }}"
openbao_namespace: openbao
openbao_leader_pod: openbao-0
openbao_follower_pods:
  - openbao-1
  - openbao-2
openbao_join_addr: http://openbao-0.openbao-internal:8200
openbao_init_file: /root/.secrets/openbao-init.dev.json
openbao_local_init_file: "{{ playbook_dir }}/../../.secrets/openbao-init.dev.json"
openbao_key_shares: 5
openbao_key_threshold: 3
openbao_dev_seed: "{{ lookup('env', 'OPENBAO_DEV_SEED') | default('gitops-dev-seed', true) }}"
openbao_eso_service_account_name: external-secrets-external-secrets
openbao_eso_service_account_namespace: external-secrets
openbao_loki_access_key_id: "loki-{{ ((openbao_dev_seed ~ ':loki-access') | hash('sha256'))[:15] }}"
openbao_loki_secret_access_key: "dev-{{ ((openbao_dev_seed ~ ':loki-secret') | hash('sha256'))[:36] }}"
