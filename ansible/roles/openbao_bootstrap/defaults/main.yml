---
openbao_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default('./kubeconfig.dev', true) }}"
openbao_namespace: openbao
openbao_leader_pod: openbao-0
openbao_follower_pods:
  - openbao-1
  - openbao-2
openbao_join_addr: http://openbao-0.openbao-internal:8200
openbao_init_file: "{{ playbook_dir }}/../../.secrets/openbao-init.dev.json"
openbao_key_shares: 5
openbao_key_threshold: 3
openbao_dev_seed: "{{ lookup('env', 'OPENBAO_DEV_SEED') | default('gitops-dev-seed', true) }}"
