---
- name: Validate Flux bootstrap secrets are provided
  ansible.builtin.assert:
    that:
      - flux_git_ssh_private_key | length > 0
      - flux_git_known_hosts | length > 0
    fail_msg: "FLUX_GIT_SSH_PRIVATE_KEY and FLUX_GIT_KNOWN_HOSTS must be provided."

- name: Check kubeconfig presence on first control plane
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: flux_bootstrap_admin_conf_stat

- name: Fail if kubeconfig is missing
  ansible.builtin.assert:
    that:
      - flux_bootstrap_admin_conf_stat.stat.exists
    fail_msg: "/etc/kubernetes/admin.conf is missing. Run cluster bootstrap first."

- name: Ensure Kubernetes API is reachable before Flux bootstrap
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
  register: flux_bootstrap_apiserver_readyz
  changed_when: false
  retries: 30
  delay: 10
  until: "'ok' in (flux_bootstrap_apiserver_readyz.stdout | default(''))"

- name: Ensure root kubeconfig directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy admin kubeconfig for root
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: "0600"
    remote_src: true

- name: Ensure SSH directory for root exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write Flux deploy key private key
  ansible.builtin.copy:
    content: "{{ flux_git_ssh_private_key }}\n"
    dest: "{{ flux_bootstrap_private_key_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write Git host SSH known_hosts entry for Flux
  ansible.builtin.copy:
    content: "{{ flux_git_known_hosts }}\n"
    dest: "{{ flux_bootstrap_known_hosts_path }}"
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Resolve Flux CLI architecture
  ansible.builtin.set_fact:
    flux_bootstrap_arch: "{{ flux_bootstrap_arch_map[ansible_architecture] | default('amd64') }}"

- name: Check if Flux CLI is already installed
  ansible.builtin.command: "{{ flux_bootstrap_cli_path }} --version"
  register: flux_bootstrap_cli_version
  changed_when: false
  failed_when: false

- name: Determine if Flux CLI version matches desired version
  ansible.builtin.set_fact:
    flux_bootstrap_cli_needs_install: "{{ flux_bootstrap_cli_version.rc != 0 or flux_bootstrap_version not in (flux_bootstrap_cli_version.stdout | default('')) }}"

- name: Download Flux install archive
  ansible.builtin.get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_bootstrap_version }}/flux_{{ flux_bootstrap_version }}_linux_{{ flux_bootstrap_arch }}.tar.gz"
    dest: /tmp/flux-cli.tar.gz
    mode: "0644"
  when: flux_bootstrap_cli_needs_install

- name: Create temporary Flux extraction directory
  ansible.builtin.file:
    path: /tmp/flux-cli
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: flux_bootstrap_cli_needs_install

- name: Extract Flux install archive
  ansible.builtin.unarchive:
    src: /tmp/flux-cli.tar.gz
    dest: /tmp/flux-cli
    remote_src: true
  when: flux_bootstrap_cli_needs_install

- name: Install Flux CLI binary
  ansible.builtin.copy:
    src: /tmp/flux-cli/flux
    dest: "{{ flux_bootstrap_cli_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: flux_bootstrap_cli_needs_install

- name: Ensure Flux namespace exists
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace {{ flux_bootstrap_namespace }}
  register: flux_bootstrap_namespace_create
  changed_when: "'created' in (flux_bootstrap_namespace_create.stdout | default(''))"
  failed_when:
    - flux_bootstrap_namespace_create.rc != 0
    - "'AlreadyExists' not in (flux_bootstrap_namespace_create.stderr | default(''))"

- name: Apply Flux controllers
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ flux_bootstrap_cli_path }} install
    --namespace {{ flux_bootstrap_namespace }}
    --components {{ flux_bootstrap_components | join(',') }}
    --network-policy=false
    --watch-all-namespaces=true
    --toleration-keys=node-role.kubernetes.io/control-plane
    --export |
    kubectl --kubeconfig /etc/kubernetes/admin.conf diff -f -
  args:
    executable: /bin/bash
  register: flux_bootstrap_install_diff
  changed_when: flux_bootstrap_install_diff.rc == 1
  failed_when: flux_bootstrap_install_diff.rc > 1

- name: Apply Flux controllers
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ flux_bootstrap_cli_path }} install
    --namespace {{ flux_bootstrap_namespace }}
    --components {{ flux_bootstrap_components | join(',') }}
    --network-policy=false
    --watch-all-namespaces=true
    --toleration-keys=node-role.kubernetes.io/control-plane
    --export |
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
  args:
    executable: /bin/bash
  register: flux_bootstrap_install_apply
  changed_when: true
  when: flux_bootstrap_install_diff.rc == 1

- name: Create temporary Flux sync directory
  ansible.builtin.file:
    path: /tmp/flux-sync
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Flux sync manifests to control plane
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/flux/clusters/dev/core/"
    dest: /tmp/flux-sync/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Apply Flux Git deploy key secret
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl --kubeconfig /etc/kubernetes/admin.conf create secret generic flux-system
    --namespace {{ flux_bootstrap_namespace }}
    --from-file=identity={{ flux_bootstrap_private_key_path }}
    --from-literal=known_hosts='{{ flux_git_known_hosts | replace("'", "'\"'\"'") }}'
    --dry-run=client -o yaml |
    kubectl --kubeconfig /etc/kubernetes/admin.conf diff -f -
  args:
    executable: /bin/bash
  register: flux_bootstrap_secret_diff
  changed_when: flux_bootstrap_secret_diff.rc == 1
  failed_when: flux_bootstrap_secret_diff.rc > 1
  no_log: true

- name: Apply Flux Git deploy key secret
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl --kubeconfig /etc/kubernetes/admin.conf create secret generic flux-system
    --namespace {{ flux_bootstrap_namespace }}
    --from-file=identity={{ flux_bootstrap_private_key_path }}
    --from-literal=known_hosts='{{ flux_git_known_hosts | replace("'", "'\"'\"'") }}'
    --dry-run=client -o yaml |
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
  args:
    executable: /bin/bash
  register: flux_bootstrap_secret_apply
  changed_when: true
  no_log: true
  when: flux_bootstrap_secret_diff.rc == 1

- name: Apply Flux source and kustomization manifests
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf diff
    --kustomize /tmp/flux-sync
  register: flux_bootstrap_sync_diff
  changed_when: flux_bootstrap_sync_diff.rc == 1
  failed_when: flux_bootstrap_sync_diff.rc > 1

- name: Apply Flux source and kustomization manifests
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply
    --kustomize /tmp/flux-sync
  register: flux_bootstrap_sync_apply
  changed_when: true
  when: flux_bootstrap_sync_diff.rc == 1

- name: Validate GHCR credentials pairing
  ansible.builtin.assert:
    that:
      - (ghcr_username | length == 0 and ghcr_token | length == 0) or (ghcr_username | length > 0 and ghcr_token | length > 0)
    fail_msg: "Set both GHCR_USERNAME and GHCR_TOKEN, or neither."

- name: Ensure workload namespaces exist for GHCR pull secrets
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf create namespace {{ item }}
  loop: "{{ ghcr_workload_namespaces }}"
  register: flux_bootstrap_ghcr_namespaces
  changed_when: false
  failed_when:
    - flux_bootstrap_ghcr_namespaces.rc != 0
    - "'AlreadyExists' not in (flux_bootstrap_ghcr_namespaces.stderr | default(''))"
  when: ghcr_username | length > 0

- name: Apply GHCR pull secret to workload namespaces
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl --kubeconfig /etc/kubernetes/admin.conf create secret docker-registry ghcr-pull
    --namespace {{ item }}
    --docker-server={{ ghcr_server }}
    --docker-username='{{ ghcr_username | replace("'", "'\"'\"'") }}'
    --docker-password='{{ ghcr_token | replace("'", "'\"'\"'") }}'
    --dry-run=client -o yaml |
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
  args:
    executable: /bin/bash
  loop: "{{ ghcr_workload_namespaces }}"
  register: flux_bootstrap_ghcr_pull_secret_apply
  changed_when: false
  no_log: true
  when: ghcr_username | length > 0

- name: Apply GHCR registry secret in flux-system
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl --kubeconfig /etc/kubernetes/admin.conf create secret docker-registry ghcr-registry
    --namespace {{ flux_bootstrap_namespace }}
    --docker-server={{ ghcr_server }}
    --docker-username='{{ ghcr_username | replace("'", "'\"'\"'") }}'
    --docker-password='{{ ghcr_token | replace("'", "'\"'\"'") }}'
    --dry-run=client -o yaml |
    kubectl --kubeconfig /etc/kubernetes/admin.conf apply -f -
  args:
    executable: /bin/bash
  register: flux_bootstrap_ghcr_registry_secret_apply
  changed_when: false
  no_log: true
  when: ghcr_username | length > 0

- name: Wait for Flux GitRepository Ready condition with retry
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf wait
    --for=condition=Ready
    --timeout={{ flux_bootstrap_ready_wait_timeout }}
    gitrepositories.source.toolkit.fluxcd.io/dev-repo
    -n {{ flux_bootstrap_namespace }}
  register: flux_bootstrap_gitrepository_ready
  changed_when: false
  failed_when: false
  retries: "{{ flux_bootstrap_ready_retries }}"
  delay: "{{ flux_bootstrap_ready_delay }}"
  until: flux_bootstrap_gitrepository_ready.rc == 0
