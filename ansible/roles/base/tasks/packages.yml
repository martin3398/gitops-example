---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Ensure chrony service is enabled and started
  ansible.builtin.service:
    name: chrony
    enabled: true
    state: started
