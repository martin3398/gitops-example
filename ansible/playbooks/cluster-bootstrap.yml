---
- name: Bootstrap first control plane
  hosts: control_plane[0]
  become: true
  gather_facts: true
  roles:
    - role: kubeadm_control_plane
      tags:
        - bootstrap
        - control-plane

- name: Install CNI on first control plane
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: cni
      tags:
        - bootstrap
        - cni

- name: Join remaining control planes
  hosts: control_plane[1:]
  become: true
  gather_facts: true
  roles:
    - role: cluster_join
      tags:
        - bootstrap
        - join

- name: Join workers
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: cluster_join
      tags:
        - bootstrap
        - join

- name: Validate cluster health
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: cluster_validate
      tags:
        - bootstrap
        - validate
