---
- name: Bootstrap first RKE2 server
  hosts: control_plane[0]
  become: true
  gather_facts: true
  roles:
    - role: rke2_control_plane
      tags:
        - bootstrap
        - control-plane

- name: Validate Cilium on first control plane
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: cni
      tags:
        - bootstrap
        - cni

- name: Join remaining RKE2 control planes
  hosts: control_plane[1:]
  become: true
  gather_facts: true
  roles:
    - role: cluster_join
      tags:
        - bootstrap
        - join

- name: Join RKE2 workers
  hosts: workers
  become: true
  gather_facts: true
  roles:
    - role: cluster_join
      tags:
        - bootstrap
        - join

- name: Validate cluster health
  hosts: control_plane[0]
  become: true
  gather_facts: false
  roles:
    - role: cluster_validate
      tags:
        - bootstrap
        - validate
