---
- name: Deploy Kafka data service
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Wait for stage 1 Flux Kustomizations readiness
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n flux-system wait
        --for=condition=Ready --timeout=5m
        kustomizations.kustomize.toolkit.fluxcd.io/{{ item }}
      loop:
        - platform-core
        - platform-data-ceph
      changed_when: false

    - name: Copy Kafka Flux stage to control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/flux/clusters/dev/data-kafka/"
        dest: /tmp/flux-data-kafka/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Apply Kafka Flux Kustomization
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply --kustomize /tmp/flux-data-kafka
      changed_when: true

    - name: Reconcile Kafka Flux Kustomization
      ansible.builtin.command: flux reconcile kustomization platform-data-kafka -n flux-system --timeout=15m --kubeconfig /etc/kubernetes/admin.conf
      changed_when: false
