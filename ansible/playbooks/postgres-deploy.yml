---
- name: Deploy Postgres data service
  hosts: control_plane[0]
  become: true
  gather_facts: false
  tasks:
    - name: Wait for stage 1 Flux Kustomizations readiness
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf -n flux-system wait
        --for=condition=Ready --timeout=5m
        kustomizations.kustomize.toolkit.fluxcd.io/{{ item }}
      loop:
        - platform-core
        - platform-data-ceph
      changed_when: false

    - name: Wait for OpenBao ClusterSecretStore readiness
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait
        --for=condition=Ready --timeout=5m clustersecretstore/openbao
      changed_when: false

    - name: Copy Postgres Flux stage to control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/flux/clusters/dev/data-postgres/"
        dest: /tmp/flux-data-postgres/
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"

    - name: Apply Postgres Flux Kustomization
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf apply --kustomize /tmp/flux-data-postgres
      changed_when: true

    - name: Reconcile Postgres Flux Kustomization
      ansible.builtin.command: flux reconcile kustomization platform-data-postgres -n flux-system --timeout=15m --kubeconfig /etc/kubernetes/admin.conf
      changed_when: false

    - name: Wait for Postgres app-user secret
      ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf -n data-postgres get secret app-user
      changed_when: false
      retries: 60
      delay: 5
      until: openbao_postgres_app_user_secret.rc == 0
      register: openbao_postgres_app_user_secret
