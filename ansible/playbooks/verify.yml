---
- name: Verify deployed GitOps dev environment
  hosts: control_plane[0]
  become: true
  gather_facts: false
  vars:
    kubeconfig: /etc/rancher/rke2/rke2.yaml
    rke2_kubectl_path: /var/lib/rancher/rke2/bin/kubectl
    expected_node_count: 6
    flux_kustomizations:
      - infrastructure-core
      - infrastructure-scheduling
      - infrastructure-data-ceph
      - infrastructure-gateway
      - infrastructure-observability
      - infrastructure-security
      - infrastructure-data-postgres
      - infrastructure-data-kafka
      - app-policies
      - app-visit-web
      - app-visit-processing
      - app-visit-loadgen
  tasks:
    - name: Wait for all Kubernetes nodes to be ready
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} wait nodes --all
        --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Verify expected node count
      ansible.builtin.shell: |
        set -euo pipefail
        node_count="$( {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} get nodes --no-headers | wc -l)"
        test "$node_count" -eq "{{ expected_node_count }}"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for Flux Git source readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n flux-system wait
        gitrepositories.source.toolkit.fluxcd.io/dev-repo
        --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Wait for expected Flux Kustomizations readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n flux-system wait
        kustomizations.kustomize.toolkit.fluxcd.io/{{ item }}
        --for=condition=Ready --timeout=10m
      loop: "{{ flux_kustomizations }}"
      changed_when: false

    - name: Wait for all Flux HelmReleases readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n flux-system wait
        helmreleases.helm.toolkit.fluxcd.io --all
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Wait for Ceph cluster readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n rook-ceph wait
        cephclusters.ceph.rook.io/rook-ceph
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Wait for Ceph block pool readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n rook-ceph get
        cephblockpools.ceph.rook.io/replicapool
        -o jsonpath={.status.phase}
      register: ceph_block_pool_phase
      changed_when: false
      retries: 60
      delay: 5
      until: ceph_block_pool_phase.stdout == "Ready"

    - name: Verify Ceph health is OK
      ansible.builtin.shell: |
        set -euo pipefail
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n rook-ceph exec deploy/rook-ceph-tools -- ceph -s | tee /tmp/ceph-status.txt
        grep -q 'health: HEALTH_OK' /tmp/ceph-status.txt
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify all persistent volume claims are bound
      ansible.builtin.shell: |
        set -euo pipefail
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} get pvc -A -o json \
          | jq -e '.items | map(select(.status.phase != "Bound")) | length == 0'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for observability workload readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n monitoring wait pod
        --for=condition=Ready --all --timeout=10m
      changed_when: false

    - name: Verify Promtail DaemonSet rollout
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n monitoring rollout status
        daemonset/monitoring-promtail --timeout=5m
      changed_when: false

    - name: Wait for OpenBao pods readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n openbao wait pod
        -l app.kubernetes.io/name=openbao
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Verify OpenBao is initialized and unsealed
      ansible.builtin.shell: |
        set -euo pipefail
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n openbao exec openbao-0 -- bao status -format=json \
          | jq -e '.initialized == true and .sealed == false'
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for OpenBao ClusterSecretStore readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} wait
        clustersecretstore.external-secrets.io/openbao
        --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Wait for all ExternalSecrets readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} wait externalsecrets.external-secrets.io
        --all --all-namespaces --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Wait for Postgres cluster readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-postgres wait
        clusters.postgresql.cnpg.io/postgres
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Wait for Postgres pods readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-postgres wait pod
        -l cnpg.io/cluster=postgres
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Wait for Kafka cluster readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-kafka wait
        kafka.kafka.strimzi.io/kafka
        --for=condition=Ready --timeout=10m
      changed_when: false

    - name: Wait for Kafka topic readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-kafka wait
        kafkatopic.kafka.strimzi.io/visits.requested
        --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Verify expected Kafka brokers are running
      ansible.builtin.shell: |
        set -euo pipefail
        broker_count="$( {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-kafka get pods -l strimzi.io/pool-name=brokers -o json | jq '[.items[] | select(.status.phase == "Running")] | length')"
        test "$broker_count" -eq 3
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for Kafka entity operator readiness
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n data-kafka wait pod
        -l strimzi.io/name=kafka-entity-operator
        --for=condition=Ready --timeout=5m
      changed_when: false

    - name: Wait for visit demo deployments availability
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n {{ item.namespace }} wait
        deployment/{{ item.name }} --for=condition=Available --timeout=5m
      loop:
        - namespace: visit-web
          name: visit-web-visit-web
        - namespace: visit-web
          name: visit-web-visit-gateway
        - namespace: visit-processing
          name: visit-processing-visit-processor
      changed_when: false

    - name: Verify Gateway API CRDs are installed
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} get crd
        gatewayclasses.gateway.networking.k8s.io
        gateways.gateway.networking.k8s.io
        httproutes.gateway.networking.k8s.io
        grpcroutes.gateway.networking.k8s.io
        referencegrants.gateway.networking.k8s.io
      changed_when: false

    - name: Verify Gateway is Accepted
      ansible.builtin.command: >-
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }}
        wait --for=condition=Accepted gateway/dev-gateway -n gateway --timeout=10m
      changed_when: false

    # Chart-owned HTTPRoutes land with their Services; nudge only if Cilium sticks.
    - name: Wait for HTTPRoute backends to resolve
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          kubectl=({{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }})

          {% raw %}
          expected_routes=(
            "monitoring/monitoring-kube-prometheus-prometheus"
            "monitoring/monitoring-kube-prometheus-stack-grafana"
            "openbao/openbao"
            "visit-web/visit-web-visit-gateway"
            "visit-web/visit-web-visit-web"
          )

          for i in $(seq 1 60); do
            unresolved=0
            for route in "${expected_routes[@]}"; do
              IFS='/' read -r ns name <<< "$route"
              ref="$("${kubectl[@]}" -n "$ns" get httproute "$name" -o jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}' 2>/dev/null || true)"
              if [ "$ref" != "True" ]; then
                unresolved=1
                if "${kubectl[@]}" -n "$ns" get httproute "$name" >/dev/null 2>&1; then
                  "${kubectl[@]}" -n "$ns" annotate httproute "$name" "reconcile.force=$(date +%s)" --overwrite >/dev/null 2>&1 || true
                fi
              fi
            done
            if [ "$unresolved" -eq 0 ]; then
              exit 0
            fi
            sleep 5
          done

          echo "HTTPRoutes still missing ResolvedRefs=True after wait:" >&2
          for route in "${expected_routes[@]}"; do
            IFS='/' read -r ns name <<< "$route"
            msg="$("${kubectl[@]}" -n "$ns" get httproute "$name" -o jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].message}' 2>/dev/null || true)"
            status="$("${kubectl[@]}" -n "$ns" get httproute "$name" -o jsonpath='{.status.parents[0].conditions[?(@.type=="ResolvedRefs")].status}' 2>/dev/null || true)"
            if [ -z "$status" ]; then
              echo "  - ${route}: NOT FOUND" >&2
            else
              echo "  - ${route}: ResolvedRefs=${status} (${msg})" >&2
            fi
          done
          exit 1
          {% endraw %}
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify Gateway API host routing
      ansible.builtin.shell: |
        set -euo pipefail
        listener_port="{{ gateway_listener_port | default(rke2_gateway_listener_port) | default(30080) }}"
        public_endpoint="{{ ingress_public_endpoint | default('') }}"

        worker_ip="$({{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} get nodes \
          -l node-role.kubernetes.io/worker=true \
          -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"
        if [ -z "$worker_ip" ]; then
          echo "No worker node InternalIP found for gateway hostNetwork checks" >&2
          exit 1
        fi

        curl_ok() {
          local host="$1" url="$2" out="${3:-}"
          local i code
          for i in $(seq 1 30); do
            if [ -n "$out" ]; then
              code="$(curl -sS -o "$out" -w '%{http_code}' -H "Host: ${host}" "$url" || true)"
            else
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: ${host}" "$url" || true)"
            fi
            case "$code" in
              2*|3*) return 0 ;;
            esac
            sleep 2
          done
          echo "Host ${host} still failing after retries (last HTTP ${code:-none}) at ${url}" >&2
          return 1
        }

        curl_ok gitops.local "http://${worker_ip}:${listener_port}/api/v1/visits/count" /tmp/visit-gateway.json
        jq -e '.data.count | type == "number"' /tmp/visit-gateway.json >/dev/null
        curl_ok grafana.gitops.local "http://${worker_ip}:${listener_port}/"
        curl_ok prometheus.gitops.local "http://${worker_ip}:${listener_port}/"
        curl_ok bao.gitops.local "http://${worker_ip}:${listener_port}/"

        if [ -n "$public_endpoint" ]; then
          curl_ok gitops.local "http://${public_endpoint}/api/v1/visits/count" /tmp/visit-gateway-public.json
          jq -e '.data.count | type == "number"' /tmp/visit-gateway-public.json >/dev/null
          curl_ok grafana.gitops.local "http://${public_endpoint}/"
          curl_ok prometheus.gitops.local "http://${public_endpoint}/"
          curl_ok bao.gitops.local "http://${public_endpoint}/"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify visit demo queue/count path
      ansible.builtin.shell: |
        set -euo pipefail
        log_file="$(mktemp)"
        {{ rke2_kubectl_path }} --kubeconfig {{ kubeconfig }} -n visit-web port-forward svc/visit-web-visit-gateway 18080:80 >"$log_file" 2>&1 &
        port_forward_pid="$!"
        trap 'kill "$port_forward_pid" 2>/dev/null || true; rm -f "$log_file"' EXIT

        for _ in $(seq 1 20); do
          if curl -fsS http://127.0.0.1:18080/api/v1/visits/count >/tmp/visit-count-before.json; then
            break
          fi
          sleep 1
        done

        before="$(jq -r '.data.count' /tmp/visit-count-before.json)"
        curl -fsS -X POST 'http://127.0.0.1:18080/api/v1/visit-events?count=2' | jq -e '.data.queued == 2'

        for _ in $(seq 1 30); do
          curl -fsS http://127.0.0.1:18080/api/v1/visits/count >/tmp/visit-count-after.json
          after="$(jq -r '.data.count' /tmp/visit-count-after.json)"
          if [ "$after" -ge "$((before + 2))" ]; then
            exit 0
          fi
          sleep 2
        done

        echo "Visit count did not increase by 2 within timeout" >&2
        echo "Before: $before" >&2
        echo "After: $(cat /tmp/visit-count-after.json 2>/dev/null || true)" >&2
        exit 1
      args:
        executable: /bin/bash
      changed_when: false
