apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: podinfo
  valuesFrom:
    - kind: ConfigMap
      name: podinfo-image
      valuesKey: image-values.yaml
  chart:
    spec:
      chart: podinfo
      version: 6.6.3
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  values:
    replicaCount: 1
    ui:
      color: "#34577d"
