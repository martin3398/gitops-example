apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
configMapGenerator:
  - name: podinfo-image
    behavior: create
    files:
      - image-values.yaml
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - imagerepository.yaml
  - imagepolicy.yaml
  - imageupdateautomation.yaml
