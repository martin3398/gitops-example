apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: visit-demo
  namespace: visit-edge
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: visit-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: visit-web
                port:
                  number: 80
