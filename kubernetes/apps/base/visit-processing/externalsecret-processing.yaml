apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: visit-demo-db
  namespace: visit-processing
spec:
  refreshInterval: 45m
  target:
    name: visit-demo-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_USER: "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: openbao-postgres-visit-processor
