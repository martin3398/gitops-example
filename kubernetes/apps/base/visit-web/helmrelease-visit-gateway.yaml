apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: visit-gateway
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: visit-web
  install:
    createNamespace: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./charts/visit-gateway
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: dev-repo
  values:
    imagePullSecrets:
      - name: ghcr-pull
    httpRoute:
      enabled: true
      hostname: gitops.local
      path: /api
      gateway:
        name: dev-gateway
        namespace: gateway
    image:
      repository: ghcr.io/martin3398/visit-gateway # {"$imagepolicy": "flux-system:visit-gateway:name"}
      tag: 20260722190253-81d07f70 # {"$imagepolicy": "flux-system:visit-gateway:tag"}
