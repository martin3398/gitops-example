apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: visit-gateway-kafka-tls
  namespace: visit-web
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-data-kafka
  target:
    name: visit-gateway-kafka-tls
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: kafka-cluster-ca-cert
        property: ca.crt
    - secretKey: user.crt
      remoteRef:
        key: visit-gateway
        property: user.crt
    - secretKey: user.key
      remoteRef:
        key: visit-gateway
        property: user.key
