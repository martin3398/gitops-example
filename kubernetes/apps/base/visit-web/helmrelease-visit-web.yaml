apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: visit-web
  namespace: flux-system
spec:
  interval: 1m
  targetNamespace: visit-web
  install:
    createNamespace: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: ./charts/visit-ui
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: dev-repo
  values:
    imagePullSecrets:
      - name: ghcr-pull
    httpRoute:
      enabled: true
      hostname: gitops.local
      path: /
      gateway:
        name: dev-gateway
        namespace: gateway
    env:
      visitGatewayUrl: http://visit-web-visit-gateway/api
    image:
      repository: ghcr.io/martin3398/visit-ui # {"$imagepolicy": "flux-system:visit-web:name"}
      tag: 20260828141134-f41c8649 # {"$imagepolicy": "flux-system:visit-web:tag"}
