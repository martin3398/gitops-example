apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-data-postgres
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-data-ceph
    - name: infrastructure-security
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/infrastructure/overlays/dev/data-postgres
  prune: true
  wait: true
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres
      namespace: data-postgres
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: app-user
      namespace: data-postgres
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      name: postgres-backups
      namespace: data-postgres
    - apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      name: postgres-daily-backup
      namespace: data-postgres
  timeout: 15m
