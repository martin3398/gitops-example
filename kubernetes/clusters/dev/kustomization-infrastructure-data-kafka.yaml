apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-data-kafka
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-data-ceph
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/infrastructure/overlays/dev/data-kafka
  prune: true
  wait: true
  healthChecks:
    - apiVersion: kafka.strimzi.io/v1
      kind: Kafka
      name: kafka
      namespace: data-kafka
  timeout: 15m