apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-observability-kafka
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-data-kafka
    - name: infrastructure-observability
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/infrastructure/overlays/dev/observability-kafka
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-kafka-exporter
      namespace: flux-system
  timeout: 15m
