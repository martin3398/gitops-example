apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-scheduling
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-core
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/infrastructure/overlays/dev/scheduling
  prune: true
  wait: true
  timeout: 15m