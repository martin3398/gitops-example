apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-gateway
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-core
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/infrastructure/overlays/dev/gateway
  prune: true
  # Cilium 1.19 hostNetwork never sets Gateway Programmed/addresses (ClusterIP has no LB ingress).
  # Readiness is enforced by pipeline:verify curling worker:30080 / public NLB:80.
  wait: false
  timeout: 15m
