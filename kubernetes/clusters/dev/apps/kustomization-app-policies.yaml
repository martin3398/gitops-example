apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-policies
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: infrastructure-core
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/apps/overlays/dev/policies
  prune: true
  wait: true
  healthChecks:
    - apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      name: prefer-non-ceph-nodes
  timeout: 15m
