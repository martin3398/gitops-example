apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-visit-loadgen
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: app-policies
    - name: app-visit-web
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/apps/base/visit-loadgen
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: visit-loadgen
      namespace: flux-system
  timeout: 15m
