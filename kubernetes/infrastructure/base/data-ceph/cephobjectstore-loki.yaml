apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: loki
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
  dataPool:
    failureDomain: host
    erasureCoded:
      dataChunks: 2
      codingChunks: 1
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 1
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 1Gi
