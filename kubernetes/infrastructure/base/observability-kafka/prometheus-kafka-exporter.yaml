apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: data-kafka
  chart:
    spec:
      chart: prometheus-kafka-exporter
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    replicaCount: 2

    kafkaServer:
      - kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9093

    extraVolumes:
      - name: kafka-cluster-ca
        secret:
          secretName: kafka-cluster-ca-cert
      - name: kafka-exporter-tls
        secret:
          secretName: kafka-exporter
    extraVolumeMounts:
      - name: kafka-cluster-ca
        mountPath: /etc/tls/ca
        readOnly: true
      - name: kafka-exporter-tls
        mountPath: /etc/tls/user
        readOnly: true

    tls:
      enabled: true
      insecureSkipVerify: false
      caFile: /etc/tls/ca/ca.crt
      certFile: /etc/tls/user/user.crt
      keyFile: /etc/tls/user/user.key

    startup:
      enabled: true
    liveness:
      enabled: true
    readiness:
      enabled: true

    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring-kube-prometheus-stack
        metricRelabelings:
          - sourceLabels: [topic]
            regex: 'visits\.requested'
            targetLabel: namespace
            replacement: visit-processing
            action: replace

    podLabels:
      app.kubernetes.io/part-of: kafka-monitoring
