apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: data-kafka
  chart:
    spec:
      chart: prometheus-kafka-exporter
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    replicaCount: 2

    kafkaServer:
      - kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9093

    tls:
      enabled: true
      insecureSkipVerify: false
      mountPath: /etc/tls
      secretName: kafka-exporter-tls
      caFile: ca.crt
      certFile: user.crt
      keyFile: user.key

    startup:
      enabled: true
    liveness:
      enabled: true
    readiness:
      enabled: true

    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring-kube-prometheus-stack
        metricRelabelings:
          - sourceLabels: [topic]
            regex: 'visits\.requested'
            targetLabel: namespace
            replacement: visit-processing
            action: replace

    podLabels:
      app.kubernetes.io/part-of: kafka-monitoring
