apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.7.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    defaultRules:
      create: true
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: storage
                      operator: NotIn
                      values:
                        - ceph
        retention: 120h
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 512Mi
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
    grafana:
      defaultDashboardsEnabled: true
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: storage
                    operator: NotIn
                    values:
                      - ceph
      sidecar:
        dashboards:
          searchNamespace: ALL
      persistence:
        enabled: true
        storageClassName: ceph-block
        size: 1Gi
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      grafana.ini:
        server:
          root_url: "%(protocol)s://%(domain)s/"
          serve_from_sub_path: false
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://monitoring-loki-gateway.monitoring.svc.cluster.local
          access: proxy
          isDefault: false
          jsonData:
            maxLines: 5000
    prometheus:
      additionalServiceMonitors:
        - name: flux-controllers
          namespaceSelector:
            matchNames:
              - flux-system
          selector:
            matchLabels:
              app.kubernetes.io/part-of: flux
          endpoints:
            - port: http-prom
              interval: 30s
      prometheusSpec:
        replicas: 1
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: storage
                      operator: NotIn
                      values:
                        - ceph
        retention: 24h
        retentionSize: 800MB
        scrapeInterval: 30s
        evaluationInterval: 30s
        walCompression: true
        externalLabels:
          cluster: dev
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2Gi
