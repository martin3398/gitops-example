apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-visit-processing-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  visit-processing-overview.json: |
    {
      "id": null,
      "uid": "visit-processing-overview",
      "title": "Visit Processing Overview",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 9,
      "time": {"from": "now-30m", "to": "now"},
      "refresh": "5s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Pods over time",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisPlacement": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "pods ready"},
                "properties": [
                  {"id": "custom.axisPlacement", "value": "right"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "pods total"},
                "properties": [
                  {"id": "custom.axisPlacement", "value": "right"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "desired pods"},
                "properties": [
                  {"id": "custom.axisPlacement", "value": "right"}
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"visit-processing\",condition=\"true\",pod=~\"visit-processing-visit-processor-.*\"})",
              "legendFormat": "pods ready"
            },
            {
              "expr": "count(kube_pod_info{namespace=\"visit-processing\",pod=~\"visit-processing-visit-processor-.*\"})",
              "legendFormat": "pods total"
            },
            {
              "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"visit-processing\",horizontalpodautoscaler=\"visit-processor\"})",
              "legendFormat": "desired pods"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Processor pods ready",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"visit-processing\",condition=\"true\",pod=~\"visit-processing-visit-processor-.*\"})",
              "legendFormat": "ready"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Processor pods total",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=\"visit-processing\",pod=~\"visit-processing-visit-processor-.*\"})",
              "legendFormat": "total"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Kafka consumer lag",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 4},
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 2000}
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(max by (partition) (kafka_consumergroup_lag{topic=\"visits.requested\", consumergroup=\"visit-processor-v1\"}))",
              "legendFormat": "lag"
            }
          ]
        },
        {
          "type": "stat",
          "title": "HPA desired pods",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 4},
          "targets": [
            {
              "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"visit-processing\",horizontalpodautoscaler=\"visit-processor\"})",
              "legendFormat": "target"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Loadgen logs",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 16},
          "datasource": "Loki",
          "targets": [
            {
              "expr": "{namespace=\"visit-loadgen\"}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka consumer lag and pods over time",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisPlacement": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "pods ready"},
                "properties": [
                  {"id": "custom.axisPlacement", "value": "right"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "desired pods"},
                "properties": [
                  {"id": "custom.axisPlacement", "value": "right"}
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum(max by (partition) (kafka_consumergroup_lag{topic=\"visits.requested\", consumergroup=\"visit-processor-v1\"}))",
              "legendFormat": "consumer lag"
            },
            {
              "expr": "sum(kube_pod_status_ready{namespace=\"visit-processing\",condition=\"true\",pod=~\"visit-processing-visit-processor-.*\"})",
              "legendFormat": "pods ready"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Average lag per pod",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "axisPlacement": "auto"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 30}
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(max by (partition) (kafka_consumergroup_lag{topic=\"visits.requested\", consumergroup=\"visit-processor-v1\"})) / clamp_min(count(kube_pod_info{namespace=\"visit-processing\",pod=~\"visit-processing-visit-processor-.*\"}), 1)",
              "legendFormat": "avg lag / pod"
            },
            {
              "expr": "vector(30)",
              "legendFormat": "30"
            }
          ]
        }
      ],
      "templating": {"list": []},
      "annotations": {"list": []}
    }
