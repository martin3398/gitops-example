apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
  namespace: monitoring
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: prometheus-adapter
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc
      port: 9090
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      maxUnavailable: 0
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus-adapter
            topologyKey: kubernetes.io/hostname
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus-adapter
    rules:
      external:
        - seriesQuery: 'kafka_consumergroup_lag{namespace="visit-processing"}'
          resources:
            overrides:
              namespace:
                resource: "namespace"
          name:
            matches: "kafka_consumergroup_lag"
            as: "kafka_consumergroup_lag_sum"
          metricsQuery: 'sum(max by (topic, partition, consumergroup) (<<.Series>>{<<.LabelMatchers>>})) by (<<.GroupBy>>)'
