apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgres-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgres-overview.json: |
    {
      "id": null,
      "uid": "postgres-cluster-overview",
      "title": "PostgreSQL CloudNativePG Overview",
      "tags": ["platform", "database", "postgres"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "Primary Instance",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1},
                  {"color": "red", "value": 2}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_is_primary{cluster=\"postgres\"})",
              "legendFormat": "Primary"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Standby Instances",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "green", "value": 2}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(cnpg_is_primary{cluster=\"postgres\"} == 0)",
              "legendFormat": "Standbys"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Max Replication Lag",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "max(cnpg_pg_replication_lag{cluster=\"postgres\"}) or max(cnpg_replication_lag{cluster=\"postgres\"}) or vector(0)",
              "legendFormat": "Max Lag"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Database Size",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_database_size_bytes{cluster=\"postgres\",datname=\"app\"}) or sum(cnpg_database_size_bytes{cluster=\"postgres\"})",
              "legendFormat": "DB Size"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Transaction Rate (Commits & Rollbacks)",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 4},
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {"axisPlacement": "auto"}
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pg_stat_database_xact_commit{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Commits/sec"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_database_xact_rollback{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Rollbacks/sec"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Active Connections & Limits",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 4},
          "fieldConfig": {
            "defaults": {
              "custom": {"axisPlacement": "auto"}
            }
          },
          "targets": [
            {
              "expr": "sum(cnpg_backends_total{cluster=\"postgres\"}) by (pod)",
              "legendFormat": "Connections - {{pod}}"
            },
            {
              "expr": "max(cnpg_pg_settings_setting{cluster=\"postgres\",name=\"max_connections\"})",
              "legendFormat": "Max Connections Limit"
            },
            {
              "expr": "sum(cnpg_backends_waiting_total{cluster=\"postgres\"})",
              "legendFormat": "Waiting Backends"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Row Operations (CRUD Throughput)",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 10},
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {"axisPlacement": "auto"}
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pg_stat_database_tup_inserted{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Inserts/sec"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_database_tup_updated{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Updates/sec"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_database_tup_deleted{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Deletes/sec"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_database_tup_fetched{cluster=\"postgres\"}[5m]))",
              "legendFormat": "Fetches/sec"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Cache Hit Ratio %",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 10},
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {"axisPlacement": "auto"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 80},
                  {"color": "green", "value": 95}
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pg_stat_database_blks_hit{cluster=\"postgres\"}[5m])) / (sum(rate(cnpg_pg_stat_database_blks_hit{cluster=\"postgres\"}[5m])) + sum(rate(cnpg_pg_stat_database_blks_read{cluster=\"postgres\"}[5m])) + 0.0001) * 100",
              "legendFormat": "Cache Hit Ratio"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Replication Lag by Standby Pod",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 16},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"axisPlacement": "auto"}
            }
          },
          "targets": [
            {
              "expr": "cnpg_pg_replication_lag{cluster=\"postgres\"} or cnpg_replication_lag{cluster=\"postgres\"}",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "WAL Archiving Activity",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 16},
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {"axisPlacement": "auto"}
            }
          },
          "targets": [
            {
              "expr": "sum(rate(cnpg_pg_stat_archiver_archived_count{cluster=\"postgres\"}[5m]))",
              "legendFormat": "WAL Archived/sec"
            },
            {
              "expr": "sum(rate(cnpg_pg_stat_archiver_failed_count{cluster=\"postgres\"}[5m]))",
              "legendFormat": "WAL Failed/sec"
            }
          ]
        }
      ],
      "templating": {"list": []},
      "annotations": {"list": []}
    }
