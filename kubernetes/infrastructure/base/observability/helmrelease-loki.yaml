apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 10m
  timeout: 15m
  dependsOn:
    - name: kube-prometheus-stack
  targetNamespace: monitoring
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: loki
      version: "6.55.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: AWS_ACCESS_KEY_ID
      targetPath: loki.storage.s3.accessKeyId
    - kind: Secret
      name: loki-s3-credentials
      valuesKey: AWS_SECRET_ACCESS_KEY
      targetPath: loki.storage.s3.secretAccessKey
  values:
    deploymentMode: Distributed
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 3
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage:
        bucketNames:
          chunks: loki-chunks
          ruler: loki-ruler
        type: s3
        s3:
          endpoint: rook-ceph-rgw-loki.rook-ceph.svc:80
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
      limits_config:
        retention_period: 24h
    distributor:
      replicas: 3
      maxUnavailable: 2
    ingester:
      replicas: 3
      chunk_encoding: snappy
    querier:
      replicas: 3
      max_concurrent: 4
      maxUnavailable: 2
    queryFrontend:
      replicas: 2
      maxUnavailable: 1
    queryScheduler:
      replicas: 2
    indexGateway:
      replicas: 2
      maxUnavailable: 1
    compactor:
      replicas: 1
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    singleBinary:
      replicas: 0
    monitoring:
      serviceMonitor:
        enabled: true
