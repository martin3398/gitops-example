apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ingress-nginx-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ingress-nginx-overview.json: |
    {
      "id": null,
      "uid": "ingress-nginx-overview",
      "title": "Ingress NGINX Overview",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "total"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "5xx response rate",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "P95 request latency (seconds)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        }
      ],
      "templating": {"list": []},
      "annotations": {"list": []}
    }
