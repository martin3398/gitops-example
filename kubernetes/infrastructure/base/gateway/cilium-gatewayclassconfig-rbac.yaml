apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-gatewayclassconfig-reader
rules:
  - apiGroups:
      - cilium.io
    resources:
      - ciliumgatewayclassconfigs
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-gatewayclassconfig-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-gatewayclassconfig-reader
subjects:
  - kind: ServiceAccount
    name: cilium-operator
    namespace: kube-system
