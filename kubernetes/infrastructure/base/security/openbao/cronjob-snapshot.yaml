apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  namespace: openbao
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: openbao-snapshot
            app.kubernetes.io/part-of: openbao
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao-snapshot
          volumes:
            - name: backup-storage
              emptyDir: {}
          initContainers:
            - name: take-snapshot
              image: quay.io/openbao/openbao:2.5.5
              imagePullPolicy: IfNotPresent
              env:
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
              command:
                - /bin/sh
                - -ec
                - |
                  echo "Authenticating to OpenBao via Kubernetes ServiceAccount..."
                  if ! bao login -method=kubernetes role=openbao-snapshot >/dev/null 2>&1; then
                    echo "bao login failed, acquiring token via auth/kubernetes/login..."
                    K8S_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                    export BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=openbao-snapshot jwt="$K8S_TOKEN")"
                  fi

                  echo "Saving Raft snapshot to /backup/snapshot.snap..."
                  bao operator raft snapshot save /backup/snapshot.snap

                  if [ ! -s /backup/snapshot.snap ]; then
                    echo "Snapshot file is missing or empty" >&2
                    exit 1
                  fi
                  echo "Snapshot generated successfully ($(wc -c < /backup/snapshot.snap) bytes)."
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          containers:
            - name: upload-s3
              image: public.ecr.aws/aws-cli/aws-cli:2.17.53
              imagePullPolicy: IfNotPresent
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: openbao-backups
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: openbao-backups
                      key: AWS_SECRET_ACCESS_KEY
                - name: BUCKET_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: openbao-backups
                      key: BUCKET_NAME
                - name: BUCKET_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: openbao-backups
                      key: BUCKET_HOST
                - name: BUCKET_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: openbao-backups
                      key: BUCKET_PORT
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
                  readOnly: true
              command:
                - /bin/sh
                - -ec
                - |
                  TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
                  TARGET_KEY="raft-snapshot-${TIMESTAMP}.snap"
                  LATEST_KEY="raft-snapshot-latest.snap"
                  S3_ENDPOINT="http://${BUCKET_HOST}:${BUCKET_PORT}"

                  echo "Uploading snapshot to s3://${BUCKET_NAME}/${TARGET_KEY}..."
                  aws --endpoint-url "${S3_ENDPOINT}" s3 cp /backup/snapshot.snap "s3://${BUCKET_NAME}/${TARGET_KEY}"

                  echo "Updating latest pointer at s3://${BUCKET_NAME}/${LATEST_KEY}..."
                  aws --endpoint-url "${S3_ENDPOINT}" s3 cp /backup/snapshot.snap "s3://${BUCKET_NAME}/${LATEST_KEY}"

                  echo "Backup completed successfully."
                  aws --endpoint-url "${S3_ENDPOINT}" s3 ls "s3://${BUCKET_NAME}/"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
