apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-kafka-secret-reader
  namespace: data-kafka
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-kafka-secret-reader-binding
  namespace: data-kafka
subjects:
  - kind: ServiceAccount
    name: external-secrets-external-secrets
    namespace: external-secrets
roleRef:
  kind: Role
  name: eso-kafka-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: k8s-data-kafka
spec:
  provider:
    kubernetes:
      remoteNamespace: data-kafka
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-external-secrets
          namespace: external-secrets
