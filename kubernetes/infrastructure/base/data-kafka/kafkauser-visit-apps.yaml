apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: visit-gateway
  namespace: data-kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: visits.requested
          patternType: literal
        operations:
          - Write
          - Describe
        host: "*"
      - resource:
          type: group
          name: visit-processor-v1
          patternType: literal
        operations:
          - Describe
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: visit-processor
  namespace: data-kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: visits.requested
          patternType: literal
        operations:
          - Read
          - Describe
        host: "*"
      - resource:
          type: topic
          name: visits.dead-letter
          patternType: literal
        operations:
          - Write
          - Describe
        host: "*"
      - resource:
          type: group
          name: visit-processor-v1
          patternType: literal
        operations:
          - Read
          - Describe
        host: "*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafka-exporter
  namespace: data-kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - Describe
        host: "*"
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - Describe
        host: "*"
      - resource:
          type: cluster
          name: kafka-cluster
          patternType: literal
        operations:
          - Describe
        host: "*"
