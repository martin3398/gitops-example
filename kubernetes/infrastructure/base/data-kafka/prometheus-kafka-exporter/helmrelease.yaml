apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-kafka-exporter
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: data-kafka
  chart:
    spec:
      chart: prometheus-kafka-exporter
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    replicaCount: 2

    kafkaServer:
      - kafka-kafka-bootstrap.data-kafka.svc.cluster.local:9092

    startup:
      enabled: true
    liveness:
      enabled: true
    readiness:
      enabled: true

    prometheus:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring-kube-prometheus-stack

    podLabels:
      app.kubernetes.io/part-of: kafka-monitoring
