apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: rook-ceph
      version: "v1.19.5"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
  values:
    image:
      repository: docker.io/rook/ceph
      tag: v1.19.5
    crds:
      enabled: true
    csi:
      enableCSIHostNetwork: true
      enableCephfsDriver: false
      provisionerReplicas: 1
