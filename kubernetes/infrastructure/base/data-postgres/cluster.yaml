apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: data-postgres
spec:
  instances: 3
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: storage
                operator: NotIn
                values:
                  - ceph
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 1Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-user
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
      s3Credentials:
        accessKeyId:
          name: postgres-backups
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backups
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 1
      data:
        compression: gzip
  monitoring:
    enablePodMonitor: true
