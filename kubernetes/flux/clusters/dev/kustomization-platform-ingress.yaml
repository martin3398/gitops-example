apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ingress
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: platform-core
    - name: platform-observability
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/platform/dev/ingress-nginx
  prune: true
  wait: true
  timeout: 15m
