apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-podinfo
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: platform-apps
    - name: platform-data
    - name: platform-ingress
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/apps/dev
  prune: true
  wait: true
  timeout: 15m
