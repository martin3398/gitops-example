apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-visit-web
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: platform-data-kafka
    - name: platform-data-postgres
    - name: platform-ingress
  sourceRef:
    kind: GitRepository
    name: dev-repo
  path: ./kubernetes/apps/dev/visit-web
  prune: true
  wait: true
  timeout: 15m
