apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
  dashboard:
    enabled: true
  monitoring:
    enabled: true
  network:
    provider: host
  crashCollector:
    disable: false
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 45s
      status:
        interval: 45s
  storage:
    useAllNodes: true
    useAllDevices: false
    devicePathFilter: ^/dev/nvme1n1$
  resources:
    mgr:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    mon:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    osd:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
