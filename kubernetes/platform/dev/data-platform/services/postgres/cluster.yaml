apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: data-postgres
spec:
  instances: 3
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: storage
                operator: NotIn
                values:
                  - ceph
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 1Gi
    storageClass: ceph-block
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-user
  monitoring:
    enablePodMonitor: true
