apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: rook-ceph
      version: "v1.15.4"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
  values:
    crds:
      enabled: true
    csi:
      enableCSIHostNetwork: true
    monitoring:
      enabled: true
      createPrometheusRules: true
      rulesNamespace: monitoring
