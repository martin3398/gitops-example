apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: openbao
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: openbao
      version: "0.28.3"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    ui:
      enabled: true
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        pathType: Prefix
        hosts:
          - paths:
              - /bao
              - /ui
              - /v1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      dataStorage:
        enabled: true
        storageClass: ceph-block
        size: 2Gi
      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ template "openbao.name" . }}
                  app.kubernetes.io/instance: "{{ .Release.Name }}"
                  component: server
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
