apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: flux-system
spec:
  releaseName: openbao
  interval: 10m
  timeout: 15m
  targetNamespace: openbao
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: openbao
      version: "0.28.4"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    csi:
      enabled: false
    ui:
      enabled: true
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        pathType: Prefix
        hosts:
          - host: bao.gitops.local
            paths:
              - /
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      dataStorage:
        enabled: true
        storageClass: ceph-block
        size: 1Gi
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
