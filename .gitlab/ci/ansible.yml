.ansible_defaults:
  image:
    name: python:3.12-slim
    entrypoint: [""]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl unzip ca-certificates bash groff jq
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir ansible boto3 botocore awscli
    - ansible-galaxy collection install -r ansible/requirements.yml
    - |
      curl -sSLo /tmp/session-manager-plugin.deb \
        "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
    - dpkg -i /tmp/session-manager-plugin.deb
    - rm -f /tmp/session-manager-plugin.deb
    - session-manager-plugin --version
    - ansible --version
  variables:
    ANSIBLE_CONFIG: ansible/ansible.cfg

ansible:lint_inventory:
  extends: .ansible_defaults
  stage: ansible_check
  script:
    - ansible-playbook -i "localhost," --syntax-check ansible/playbooks/smoke.yml
    - ansible-playbook -i "localhost," --syntax-check ansible/playbooks/base.yml
    - ansible-playbook -i "localhost," --syntax-check ansible/playbooks/runtime.yml
    - ansible-playbook -i "localhost," --syntax-check ansible/playbooks/cluster-bootstrap.yml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

ansible:inventory:
  extends: .ansible_defaults
  stage: ansible_inventory
  resource_group: infra
  needs:
    - job: tofu:apply
      artifacts: true
  script:
    - test -f infra/outputs.json
    - python3 ansible/scripts/generate_inventory.py --input infra/outputs.json --output ansible/inventories/lab/hosts.yml --region "$AWS_REGION" --ssm-bucket "$TF_STATE_BUCKET"
    - ansible-inventory -i ansible/inventories/lab/hosts.yml --graph
  artifacts:
    name: "ansible-inventory-${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}"
    paths:
      - ansible/inventories/lab/hosts.yml
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

ansible:smoke:
  extends: .ansible_defaults
  stage: ansible_smoke
  resource_group: infra
  needs:
    - job: ansible:inventory
      artifacts: true
  script:
    - test -f ansible/inventories/lab/hosts.yml
    - ansible-playbook -i ansible/inventories/lab/hosts.yml ansible/playbooks/smoke.yml
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

ansible:base:
  extends: .ansible_defaults
  stage: ansible_base
  resource_group: infra
  needs:
    - job: ansible:inventory
      artifacts: true
    - job: ansible:smoke
  script:
    - test -f ansible/inventories/lab/hosts.yml
    - ansible-playbook -i ansible/inventories/lab/hosts.yml ansible/playbooks/base.yml --tags base
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

ansible:runtime:
  extends: .ansible_defaults
  stage: ansible_runtime
  resource_group: infra
  needs:
    - job: ansible:inventory
      artifacts: true
    - job: ansible:base
  script:
    - test -f ansible/inventories/lab/hosts.yml
    - ansible-playbook -i ansible/inventories/lab/hosts.yml ansible/playbooks/runtime.yml --tags runtime
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never

ansible:bootstrap:
  extends: .ansible_defaults
  stage: ansible_bootstrap
  resource_group: infra
  needs:
    - job: ansible:inventory
      artifacts: true
    - job: ansible:runtime
  script:
    - test -f ansible/inventories/lab/hosts.yml
    - ansible-playbook -i ansible/inventories/lab/hosts.yml ansible/playbooks/cluster-bootstrap.yml --tags bootstrap
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
