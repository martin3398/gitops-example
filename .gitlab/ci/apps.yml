.apps_source_changes: &apps_source_changes
  - apps/visit-demo/**/*
  - charts/visit-ui/**/*
  - charts/visit-gateway/**/*
  - charts/visit-processor/**/*

apps:visit-gateway:test:
  stage: app_check
  image:
    name: golang:1.23
    entrypoint: [""]
  before_script: []
  script:
    - cd apps/visit-demo/visit-gateway
    - go test ./...
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *apps_source_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *apps_source_changes

apps:visit-processor:test:
  stage: app_check
  image:
    name: golang:1.23
    entrypoint: [""]
  before_script: []
  script:
    - cd apps/visit-demo/visit-processor
    - go test ./...
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *apps_source_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *apps_source_changes

apps:visit-ui:test:
  stage: app_check
  image:
    name: node:22-alpine
    entrypoint: [""]
  before_script: []
  script:
    - cd apps/visit-demo/visit-ui
    - npm ci
    - npm run check
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *apps_source_changes
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *apps_source_changes

.docker_buildx_template:
  stage: app_build
  image:
    name: docker:27
    entrypoint: [""]
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  before_script:
    - test -n "$GHCR_USERNAME"
    - test -n "$GHCR_TOKEN"
    - export GHCR_OWNER="${GHCR_OWNER:-$GHCR_USERNAME}"
    - docker login ghcr.io -u "$GHCR_USERNAME" -p "$GHCR_TOKEN"
    - docker buildx create --name gitlab-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx build \
          --platform linux/amd64 \
          --file "$DOCKERFILE_PATH" \
          --tag "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${CI_COMMIT_TAG}" \
          --tag "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:sha-${CI_COMMIT_SHORT_SHA}" \
          --push "$BUILD_CONTEXT"
      else
        docker buildx build \
          --platform linux/amd64 \
          --file "$DOCKERFILE_PATH" \
          --tag "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:main-${CI_COMMIT_SHORT_SHA}" \
          --tag "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:sha-${CI_COMMIT_SHORT_SHA}" \
          --push "$BUILD_CONTEXT"
      fi
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^flux\(image\):/'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *apps_source_changes
    - when: never

apps:visit-gateway:build:
  extends: .docker_buildx_template
  needs:
    - apps:visit-gateway:test
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/apps/visit-demo/visit-gateway"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/apps/visit-demo/visit-gateway/Dockerfile"
    IMAGE_NAME: visit-gateway

apps:visit-processor:build:
  extends: .docker_buildx_template
  needs:
    - apps:visit-processor:test
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/apps/visit-demo/visit-processor"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/apps/visit-demo/visit-processor/Dockerfile"
    IMAGE_NAME: visit-processor

apps:visit-ui:build:
  extends: .docker_buildx_template
  needs:
    - apps:visit-ui:test
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/apps/visit-demo/visit-ui"
    DOCKERFILE_PATH: "$CI_PROJECT_DIR/apps/visit-demo/visit-ui/Dockerfile"
    IMAGE_NAME: visit-ui
