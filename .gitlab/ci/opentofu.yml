variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

stages:
  - check
  - plan
  - apply
  - destroy

default:
  image:
    name: ghcr.io/opentofu/opentofu:1.8.8
    entrypoint: [""]
  before_script:
    - tofu version
    - test -d infra
    - cd infra

cache:
  key:
    files:
      - infra/.terraform.lock.hcl
  paths:
    - infra/.terraform/

.tofu_init_backend: &tofu_init_backend
  - |
    tofu init \
      -backend-config="bucket=${TF_STATE_BUCKET}" \
      -backend-config="key=${TF_STATE_KEY}" \
      -backend-config="region=${AWS_REGION}" \
      -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
      -backend-config="encrypt=true"

tofu:fmt_validate:
  stage: check
  script:
    - tofu fmt -check -recursive
    - *tofu_init_backend
    - tofu validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

tofu:plan:
  stage: plan
  resource_group: infra
  script:
    - *tofu_init_backend
    - tofu plan -out phase1-infra.tfplan
    - tofu show -no-color phase1-infra.tfplan > plan.txt
  artifacts:
    name: "tofu-plan-${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}"
    paths:
      - infra/phase1-infra.tfplan
      - infra/plan.txt
    expire_in: 7 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

tofu:apply:
  stage: apply
  resource_group: infra
  needs:
    - job: tofu:plan
      artifacts: true
  script:
    - *tofu_init_backend
    - tofu apply -auto-approve phase1-infra.tfplan
    - tofu output -json > outputs.json
  artifacts:
    name: "tofu-outputs-${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_ID}"
    paths:
      - infra/outputs.json
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never

tofu:destroy:
  stage: destroy
  resource_group: infra
  script:
    - *tofu_init_backend
    - tofu plan -destroy -out destroy.tfplan
    - tofu apply -auto-approve destroy.tfplan
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DESTROY_CONFIRM == "yes"'
      when: manual
      allow_failure: false
    - when: never
