version: "3"

dotenv:
  - .env

vars:
  OUTPUTS: infra/outputs.json
  INVENTORY: ansible/inventories/dev/hosts.yml
  ANSIBLE_CONFIG_FILE: ansible/ansible.cfg
  VENV_PYTHON: .venv/bin/python3
  VENV_ANSIBLE: .venv/bin/ansible
  VENV_ANSIBLE_GALAXY: .venv/bin/ansible-galaxy
  VENV_ANSIBLE_PLAYBOOK: .venv/bin/ansible-playbook
  VENV_ANSIBLE_INVENTORY: .venv/bin/ansible-inventory
  KUBECONFIG_FILE: "{{.TASKFILE_DIR}}/kubeconfig.dev"

tasks:
  "venv:install":
    desc: "Create .venv and install Python + Ansible dependencies"
    cmds:
      - 'python3 -m venv .venv'
      - '{{.VENV_PYTHON}} -m pip install --upgrade pip'
      - '{{.VENV_PYTHON}} -m pip install -r ansible/python-requirements.txt'
      - '{{.VENV_ANSIBLE}} --version'
      - '{{.VENV_ANSIBLE_GALAXY}} collection install -r ansible/requirements.yml'

  "venv:check":
    internal: true
    preconditions:
      - sh: 'test -x "{{.VENV_PYTHON}}"'
        msg: "Missing .venv/bin/python3. Create venv and install dependencies first."
      - sh: 'test -x "{{.VENV_ANSIBLE_PLAYBOOK}}"'
        msg: "Missing .venv/bin/ansible-playbook. Install ansible into .venv first."
      - sh: 'test -x "{{.VENV_ANSIBLE_INVENTORY}}"'
        msg: "Missing .venv/bin/ansible-inventory. Install ansible into .venv first."
      - sh: 'test -x "{{.VENV_ANSIBLE}}"'
        msg: "Missing .venv/bin/ansible. Install ansible into .venv first."
    cmds:
      - "printf 'Virtual environment looks good.\\n'"

  "env:check":
    desc: "Check required local environment variables"
    preconditions:
      - sh: 'test -n "$AWS_PROFILE"'
        msg: "AWS_PROFILE is required (for example: gitops-dev)"
      - sh: 'test -n "$AWS_REGION"'
        msg: "AWS_REGION is required (for example: eu-central-1)"
      - sh: 'test -n "$ANSIBLE_SSM_BUCKET"'
        msg: "ANSIBLE_SSM_BUCKET is required"
    cmds:
      - "printf 'Environment looks good.\\n'"

  "tofu:fmt_validate":
    desc: "Run tofu fmt check and validate"
    dir: infra
    cmds:
      - "tofu fmt -check -recursive"
      - "tofu validate"

  "tofu:plan":
    desc: "Run tofu plan and save plan artifact"
    dir: infra
    cmds:
      - "tofu plan -out phase1-infra.tfplan"
      - "tofu show -no-color phase1-infra.tfplan > plan.txt"

  "tofu:apply":
    desc: "Apply tofu plan and export outputs"
    dir: infra
    cmds:
      - "tofu apply -auto-approve phase1-infra.tfplan"
      - "tofu output -json > outputs.json"

  "tofu:destroy":
    desc: "Destroy infrastructure (requires DESTROY_CONFIRM=yes)"
    dir: infra
    preconditions:
      - sh: 'test "$DESTROY_CONFIRM" = "yes"'
        msg: "DESTROY_CONFIRM=yes is required to run tofu:destroy"
    cmds:
      - "tofu plan -destroy -out destroy.tfplan"
      - "tofu apply -auto-approve destroy.tfplan"

  "tofu:get_public_host":
    desc: "Print public ingress host from tofu outputs"
    preconditions:
      - sh: 'command -v tofu >/dev/null 2>&1'
        msg: "tofu is required in PATH"
      - sh: 'test -n "$(tofu -chdir=infra output -raw ingress_public_endpoint 2>/dev/null)"'
        msg: "Missing ingress_public_endpoint output. Run task tofu:apply first and enable public ingress."
    cmds:
      - 'tofu -chdir=infra output -raw ingress_public_endpoint'

  "ansible:lint_inventory":
    desc: "Syntax check all Ansible playbooks"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    cmds:
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/smoke.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/base.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/runtime.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/cluster-bootstrap.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/flux-bootstrap.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/openbao-bootstrap.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/postgres-deploy.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/kafka-deploy.yml"
      - "{{.VENV_ANSIBLE_PLAYBOOK}} -i 'localhost,' --syntax-check ansible/playbooks/apps-deploy.yml"

  "ansible:inventory":
    desc: "Generate Ansible inventory from infra outputs"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.OUTPUTS}}"'
        msg: "Missing infra/outputs.json. Run task tofu:apply first."
      - sh: 'test -n "$AWS_REGION"'
        msg: "AWS_REGION is required"
      - sh: 'test -n "${ANSIBLE_SSM_BUCKET:-$TF_STATE_BUCKET}"'
        msg: "ANSIBLE_SSM_BUCKET or TF_STATE_BUCKET is required"
    cmds:
      - '{{.VENV_PYTHON}} ansible/scripts/generate_inventory.py --input "{{.OUTPUTS}}" --output "{{.INVENTORY}}" --region "$AWS_REGION" --ssm-bucket "${ANSIBLE_SSM_BUCKET:-$TF_STATE_BUCKET}"'
      - '{{.VENV_ANSIBLE_INVENTORY}} -i "{{.INVENTORY}}" --graph'

  "ansible:inventory_from_state":
    desc: "Generate Ansible inventory from tofu state"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'command -v tofu >/dev/null 2>&1'
        msg: "tofu is required in PATH"
      - sh: 'tofu -chdir=infra output -json ansible_inventory >/dev/null 2>&1'
        msg: "Missing ansible_inventory output in tofu state. Run task tofu:apply first."
      - sh: 'test -n "$AWS_REGION"'
        msg: "AWS_REGION is required"
      - sh: 'test -n "${ANSIBLE_SSM_BUCKET:-$TF_STATE_BUCKET}"'
        msg: "ANSIBLE_SSM_BUCKET or TF_STATE_BUCKET is required"
    cmds:
      - 'tmp_json="$(mktemp)" && tofu -chdir=infra output -json ansible_inventory > "$tmp_json" && {{.VENV_PYTHON}} ansible/scripts/generate_inventory.py --input "$tmp_json" --output "{{.INVENTORY}}" --region "$AWS_REGION" --ssm-bucket "${ANSIBLE_SSM_BUCKET:-$TF_STATE_BUCKET}" && rm -f "$tmp_json"'
      - '{{.VENV_ANSIBLE_INVENTORY}} -i "{{.INVENTORY}}" --graph'

  "ansible:smoke":
    desc: "Run Ansible smoke checks"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - |
        tries=12
        delay=15
        i=1
        while [ "$i" -le "$tries" ]; do
          if {{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/smoke.yml; then
            exit 0
          fi
          if [ "$i" -lt "$tries" ]; then
            printf "SM not ready yet (attempt %s/%s). Retrying in %ss...\n" "$i" "$tries" "$delay"
            sleep "$delay"
          fi
          i=$((i + 1))
        done
        {{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/smoke.yml

  "ansible:base":
    desc: "Run Ansible base role"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/base.yml --tags base'

  "ansible:runtime":
    desc: "Run Ansible runtime role"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/runtime.yml --tags runtime'

  "ansible:bootstrap":
    desc: "Run Ansible cluster bootstrap role"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/cluster-bootstrap.yml --tags bootstrap'

  "ansible:core":
    desc: "Install Flux and deploy core platform stage"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
      - sh: 'test -n "$FLUX_GIT_SSH_PRIVATE_KEY_B64"'
        msg: "FLUX_GIT_SSH_PRIVATE_KEY_B64 is required"
      - sh: 'test -n "$FLUX_GIT_KNOWN_HOSTS_B64"'
        msg: "FLUX_GIT_KNOWN_HOSTS_B64 is required"
    cmds:
      - 'export FLUX_GIT_SSH_PRIVATE_KEY="$(printf %s "$FLUX_GIT_SSH_PRIVATE_KEY_B64" | base64 -d)" && export FLUX_GIT_KNOWN_HOSTS="$(printf %s "$FLUX_GIT_KNOWN_HOSTS_B64" | base64 -d)" && {{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/flux-bootstrap.yml --tags flux'

  "ansible:get_kubeconfig":
    desc: "Fetch admin kubeconfig from first control plane"
    internal: true
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE}} control_plane[0] -i "{{.INVENTORY}}" -b -m ansible.builtin.fetch -a "src=/etc/kubernetes/admin.conf dest={{.KUBECONFIG_FILE}} flat=true"'
      - 'chmod 600 "{{.KUBECONFIG_FILE}}"'

  "ansible:kubeconfig_public_endpoint":
    desc: "Point local kubeconfig at external API endpoint"
    internal: true
    preconditions:
      - sh: 'test -f "{{.KUBECONFIG_FILE}}"'
        msg: "Missing {{.KUBECONFIG_FILE}}. Run task ansible:get_kubeconfig first."
      - sh: 'command -v kubectl >/dev/null 2>&1'
        msg: "kubectl is required in PATH"
      - sh: 'test -n "$(tofu -chdir=infra output -raw kubernetes_api_endpoint)"'
        msg: "Missing kubernetes_api_endpoint output. Run task tofu:apply first."
    cmds:
      - 'endpoint="$(tofu -chdir=infra output -raw kubernetes_api_endpoint)" && kubectl config set-cluster kubernetes --server="https://${endpoint}" --kubeconfig "{{.KUBECONFIG_FILE}}"'
      - 'chmod 600 "{{.KUBECONFIG_FILE}}"'

  "ansible:get_kubeconfig_public":
    desc: "Fetch kubeconfig and point it to external API endpoint"
    cmds:
      - task: "ansible:get_kubeconfig"
      - task: "ansible:kubeconfig_public_endpoint"

  "ansible:openbao":
    desc: "Deploy and bootstrap OpenBao"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/openbao-bootstrap.yml'

  "ansible:postgres":
    desc: "Deploy Postgres data service"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/postgres-deploy.yml'

  "ansible:kafka":
    desc: "Deploy Kafka data service"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/kafka-deploy.yml'

  "ansible:apps":
    desc: "Deploy visit demo apps"
    deps:
      - "venv:check"
    env:
      ANSIBLE_CONFIG: "{{.ANSIBLE_CONFIG_FILE}}"
    preconditions:
      - sh: 'test -f "{{.INVENTORY}}"'
        msg: "Missing ansible inventory file. Run task ansible:inventory first."
    cmds:
      - '{{.VENV_ANSIBLE_PLAYBOOK}} -i "{{.INVENTORY}}" ansible/playbooks/apps-deploy.yml'

  "pipeline:check":
    desc: "Run local checks equivalent to CI check stages"
    cmds:
      - task: "tofu:fmt_validate"
      - task: "ansible:lint_inventory"

  "pipeline:init_cluster":
    desc: "Provision infrastructure and bootstrap Kubernetes without Flux"
    cmds:
      - task: "tofu:plan"
      - task: "tofu:apply"
      - task: "ansible:inventory"
      - task: "ansible:smoke"
      - task: "ansible:base"
      - task: "ansible:runtime"
      - task: "ansible:bootstrap"

  "pipeline:main":
    desc: "Run full local deployment pipeline"
    cmds:
      - task: "pipeline:init_cluster"
      - task: "ansible:core"
      - task: "ansible:openbao"
      - task: "ansible:postgres"
      - task: "ansible:kafka"
      - task: "ansible:apps"

  "openbao:hosts_entries":
    desc: "Print /etc/hosts entries for bao.gitops.local"
    preconditions:
      - sh: 'command -v tofu >/dev/null 2>&1'
        msg: "tofu is required in PATH"
      - sh: 'test -n "$(tofu -chdir=infra output -raw ingress_public_endpoint 2>/dev/null)"'
        msg: "Missing ingress_public_endpoint output. Run task tofu:apply first and enable public ingress."
    cmds:
      - |
        host="$(tofu -chdir=infra output -raw ingress_public_endpoint)"
        getent ahostsv4 "$host" | awk '{print $1}' | sort -u | while read -r ip; do
          printf '%s bao.gitops.local\n' "$ip"
        done

  "openbao:status":
    desc: "Show OpenBao status from first pod"
    preconditions:
      - sh: 'test -f "{{.KUBECONFIG_FILE}}"'
        msg: "Missing {{.KUBECONFIG_FILE}}. Run task ansible:get_kubeconfig_public first."
    cmds:
      - |
        set +e
        KUBECONFIG="{{.KUBECONFIG_FILE}}" kubectl -n openbao exec openbao-0 -- bao status
        status=$?
        set -e
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          exit "$status"
        fi
