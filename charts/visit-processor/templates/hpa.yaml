apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visit-processor
  namespace: visit-processing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: visit-processing-visit-processor
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: kafka_consumergroup_lag_sum
          selector:
            matchLabels:
              topic: visits.requested
              consumergroup: visit-processor-v1
        target:
          type: AverageValue
          averageValue: "30"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 10
          periodSeconds: 10
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 5
          periodSeconds: 10
