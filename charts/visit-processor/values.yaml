replicaCount: 1

image:
  repository: ghcr.io/example/visit-processor
  tag: v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

env:
  KAFKA_BROKERS: kafka-kafka-bootstrap.data-kafka.svc:9092
  KAFKA_TOPIC: visits.requested
  KAFKA_GROUP_ID: visit-processor-v1
  DB_HOST: postgres-rw.data-postgres.svc
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app
  RATE_LIMIT_PER_SEC: "1"

secretName: visit-demo-db

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 256Mi
