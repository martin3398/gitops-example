replicaCount: 1

image:
  repository: ghcr.io/martin3398/visit-gateway
  tag: v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80
  targetPort: 8080

httpRoute:
  enabled: false
  hostname: gitops.local
  path: /api
  gateway:
    name: dev-gateway
    namespace: gateway

env:
  KAFKA_BROKERS: kafka-kafka-bootstrap.data-kafka.svc:9093
  KAFKA_TOPIC: visits.requested
  KAFKA_GROUP_ID: visit-processor-v1
  KAFKA_TLS_ENABLED: "true"
  KAFKA_TLS_CA_FILE: /etc/kafka/tls/ca.crt
  KAFKA_TLS_CERT_FILE: /etc/kafka/tls/user.crt
  KAFKA_TLS_KEY_FILE: /etc/kafka/tls/user.key
  KAFKA_TLS_INSECURE_SKIP_VERIFY: "false"
  DB_HOST: postgres-rw.data-postgres.svc
  DB_PORT: "5432"
  DB_NAME: app
  DB_USER: app

secretName: visit-demo-db
kafkaTlsSecretName: visit-gateway-kafka-tls


resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 256Mi
