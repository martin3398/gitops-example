replicaCount: 1

image:
  repository: ghcr.io/martin3398/visit-loadgen
  tag: v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  targetBaseUrl: http://visit-web-visit-gateway.visit-web.svc/api/v1
  mode: paused
  fixedBand: idle
  bands: idle=0.2:1:1,below=1:3:1,capacity=3:8:1,overload=8:12:1,burst=15:20:1
  minPhaseDuration: 120s
  maxPhaseDuration: 240s
  statusInterval: 10s
  reloadInterval: 10s
  requestTimeout: 5s
  maxBatch: "100"

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
