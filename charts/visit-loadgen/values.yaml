replicaCount: 1

image:
  repository: ghcr.io/martin3398/visit-loadgen
  tag: v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  targetBaseUrl: http://visit-web-visit-gateway.visit-web.svc/api/v1
  mode: paused
  fixedBand: idle
  bands: idle=0:0.5:5,below=1:4:4,capacity=8:12:8,overload=13:16:2,burst=17:22:1
  minPhaseDuration: 300s
  maxPhaseDuration: 600s
  statusInterval: 10s
  reloadInterval: 10s
  requestTimeout: 5s
  maxBatch: "100"

resources:
  requests:
    cpu: 5m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
