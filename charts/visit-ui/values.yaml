replicaCount: 1

image:
  repository: ghcr.io/martin3398/visit-ui
  tag: v0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80
  targetPort: 3000

env:
  visitGatewayUrl: http://visit-web-visit-gateway/api

probes:
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 5

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
